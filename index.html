<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THWS Adventskalender 2026</title>

  <!-- Bootstrap 5 CSS (fertiges Design-Framework) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- Unsere eigenen Styles -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER / NAVIGATION ===== -->
  <!-- Zuständig: Dennis -->
  <header class="thws-header py-3">
   <div class="container-fluid px-2 thws-header-inner">
  
  <!-- Logo -->
  <img src="img/thws-logo.png" alt="THWS Logo" style="height: 80px;">

  <!-- Text -->
  <div>
    <small class="text-muted header-breadcrumb">
  <span>Startseite</span> &gt; <span>Aktuelles</span> &gt;
</small><br>
    <strong>Adventskalender</strong>
  </div>
</div>
  </header>


  <!-- ===== HERO-BEREICH ===== -->
  <!-- Zuständig: Dennis -->
  <section class="hero-bereich text-center py-5">
    <div class="container">
      <h1 class="display-4 fw-bold">🎄 THWS Adventskalender</h1>
      <p class="lead text-muted">Jeden Tag ein neues Türchen – viel Spaß!</p>
    </div>
  </section>

  <!-- ===== KALENDER GRID (24 Türchen) ===== -->
  <!-- Zuständig: Dennis (Logik in js/kalender.js) -->
  <main class="container my-5">
    <div class="row g-3" id="kalender-grid">
      <!-- Die 24 Türchen werden per JavaScript eingefügt (siehe js/kalender.js) -->
    </div>
  </main>

  <!-- ===== MODAL: Türchen-Inhalt ===== -->
  <!-- Zuständig: Artjom (Logik in js/inhalte.js) -->
  <div class="modal fade" id="tuerchen-modal" tabindex="-1" aria-labelledby="tuerchen-modal-titel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content weihnachts-modal">

        <div class="modal-header">
          <h5 class="modal-title" id="tuerchen-modal-titel">Türchen</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button>
        </div>

        <div class="modal-body" id="tuerchen-modal-inhalt">
          <!-- Inhalt wird per JavaScript geladen (siehe js/inhalte.js) -->
        </div>

      </div>
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer class="text-center text-muted py-4 mt-5 border-top">
    <small>© 2026 THWS – Technische Hochschule Würzburg-Schweinfurt</small>
  </footer>

  <!-- Bootstrap 5 JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Unsere JavaScript-Dateien -->
  <script src="js/kalender.js"></script>   <!-- Dennis:  Türchen-Logik & Grid -->
  <script src="js/inhalte.js"></script>    <!-- Artjom: Inhalte & Modal -->

</body>
</html>
