<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THWS Adventskalender 2026</title>

  <!-- Bootstrap 5 CSS (fertiges Design-Framework) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <!-- Unsere eigenen Styles -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER / NAVIGATION ===== -->
  <!-- Zuständig: Dennis -->
  <header class="thws-header py-3">
   <div class="container-fluid px-2 thws-header-inner">
  
  <!-- Logo -->
  <a href="https://www.thws.de" target="_blank">
  <img class="thws-logo" src="img/thws-logo.png" alt="THWS Logo" style="height: 80px;">
</a>

  <!-- Text -->
  <div>
    <small class="text-muted header-breadcrumb">
  <span>Startseite</span> &gt; <span>Aktuelles</span> &gt; <strong>Adventskalender</strong>
</small>
  </div>

  <button
    class="content-btn ms-auto"
    type="button"
    aria-label="Mein Inhalt (Login erforderlich)"
    data-bs-toggle="offcanvas"
    data-bs-target="#meinInhaltHinweis"
    aria-controls="meinInhaltHinweis"
  >
    <i class="bi bi-gift"></i>
    Mein Inhalt
  </button>

<button class="login-btn ms-3">
  <i class="bi bi-mortarboard-fill"></i>
  Login
</button>
  </header>

  <!-- ===== OFFCANVAS: Hinweis für nicht eingeloggte Nutzer ===== -->
  <div class="offcanvas offcanvas-end login-hinweis-offcanvas" tabindex="-1" id="meinInhaltHinweis" aria-labelledby="meinInhaltHinweisLabel">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="meinInhaltHinweisLabel">
        <i class="bi bi-lock-fill me-2"></i>Mein Inhalt
      </h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Schließen"></button>
    </div>
    <div class="offcanvas-body">
      <p class="mb-3">Bitte zuerst einloggen.</p>
      <button type="button" class="btn login-submit-btn w-100" data-bs-dismiss="offcanvas" data-bs-toggle="modal" data-bs-target="#login-modal">
        Zum Login
      </button>
    </div>
  </div>


  <!-- ===== HERO-BEREICH ===== -->
  <!-- Zuständig: Dennis -->
  <section class="hero-bereich text-center py-5">
    <div class="container">
      <h1 class="display-4 fw-bold">🎄 THWS Adventskalender</h1>
      <p class="lead text-muted">Jeden Tag ein neues Türchen – viel Spaß!</p>
    </div>
  </section>

  <!-- ===== KALENDER GRID (24 Türchen) ===== -->
  <!-- Zuständig: Dennis (Logik in js/kalender.js) -->
  <main class="container my-5">
    <div class="row g-3" id="kalender-grid">
      <!-- Die 24 Türchen werden per JavaScript eingefügt (siehe js/kalender.js) -->
    </div>
  </main>

  <!-- ===== UI-Placeholder: Hinweis für gesperrte Türchen ===== -->
  <div id="gesperrt-hinweis" class="gesperrt-hinweis-toast" role="status" aria-live="polite">
    Verfügbar ab TT.MM.
  </div>

  <!-- ===== MODAL: Türchen-Inhalt ===== -->
  <!-- Zuständig: Artjom (Logik in js/inhalte.js) -->
  <div class="modal fade" id="tuerchen-modal" tabindex="-1" aria-labelledby="tuerchen-modal-titel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content weihnachts-modal">

        <div class="modal-header">
          <h5 class="modal-title" id="tuerchen-modal-titel">Türchen</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button>
        </div>

        <div class="modal-body" id="tuerchen-modal-inhalt">
          <!-- Inhalt wird per JavaScript geladen (siehe js/inhalte.js) -->
        </div>

      </div>
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer class="text-center text-muted py-4 mt-5 border-top">
    <small>© 2026 THWS – Technische Hochschule Würzburg-Schweinfurt</small>
  </footer>

  <!-- Bootstrap 5 JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Unsere JavaScript-Dateien -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/kalender.js"></script>   <!-- Dennis:  Türchen-Logik & Grid -->
  <script src="js/inhalte.js"></script>    <!-- Artjom: Inhalte & Modal -->

</body>
</html>
